[project]
name = "tg-bot"
version = "0.1.0"
description = "Telegram bot + FastAPI service turning a movie name or document into wordsman wordlists"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiogram>=3.13",
  "click>=8.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "loguru>=0.7",
  "pydantic-settings>=2.5",
  "pypdf>=5.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
]

[project.scripts]
tg-bot = "tg_bot.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Integration tests drive the real wordsman checkout (and optionally the live subtitle
# providers), so the default run excludes them; `-m integration` on the CLI overrides this.
addopts = "-q -m 'not integration' --cov=tg_bot --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"
markers = [
  "integration: needs a real wordsman checkout with its Git-LFS data/ pulled (just test-integration)",
  "network: additionally hits the live subtitle providers (just test-integration-network)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "# pragma: no cover"]
