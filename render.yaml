# Render Blueprint for @wordsman_bot — API-ONLY standby (dockerCommand: tg-bot serve).
# The Telegram side lives on Fly (fly.toml) in webhook mode; this service is a WARM
# SPARE. It carries TG_BOT_PUBLIC_URL + TG_BOT_WEBHOOK_SECRET (dashboard/API, sync: false)
# so it CAN take over, but a start never steals a live webhook — it logs "standby" and
# waits. Promote deliberately: `tg-bot webhook set` here, or redeploy with
# TG_BOT_WEBHOOK_FORCE_CLAIM=true. Verified as an active host 2026-08-20 (0.24s warm),
# then handed back to Fly, which wakes a stopped machine in ~9s versus Render's ~50s
# cold start after its ~15 min idle sleep.
services:
  - type: web
    name: wordsman-tg-bot
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./deploy/Dockerfile.cloud
    dockerContext: .
    dockerCommand: tg-bot serve
    healthCheckPath: /healthz
    envVars:
      - key: TG_BOT_PORT
        value: "10000" # Render's canonical web port
      - key: TELEGRAM_BOT_TOKEN
        sync: false # set via dashboard/API, never committed
      - key: TG_BOT_SERVICE_NOTIFY
        value: "false" # standby stays silent in the service chat
