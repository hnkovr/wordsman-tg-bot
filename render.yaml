# Render Blueprint for @wordsman_bot — API-ONLY standby (dockerCommand: tg-bot serve).
# The Telegram side lives on Fly (fly.toml) in webhook mode. Telegram delivers to exactly
# one URL per token, and this service deliberately leaves TG_BOT_PUBLIC_URL unset, so it
# never claims the webhook away from Fly no matter how often it redeploys.
# To promote Render to the active bot: set TG_BOT_PUBLIC_URL to this service's own URL
# plus TG_BOT_WEBHOOK_SECRET and redeploy — whichever deployment last called setWebhook
# owns the token. Free-plan idle sleep is survivable in webhook mode (the delivery wakes
# the service and Telegram retries), at the cost of ~50s before the first reply.
services:
  - type: web
    name: wordsman-tg-bot
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./deploy/Dockerfile.cloud
    dockerContext: .
    dockerCommand: tg-bot serve
    healthCheckPath: /healthz
    envVars:
      - key: TG_BOT_PORT
        value: "10000" # Render's canonical web port
      - key: TELEGRAM_BOT_TOKEN
        sync: false # set via dashboard/API, never committed
      - key: TG_BOT_SERVICE_NOTIFY
        value: "false" # standby stays silent in the service chat
