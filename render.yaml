# Render Blueprint for @wordsman_bot — API-ONLY standby (dockerCommand: tg-bot serve).
# STAGING on its OWN bot, @wordsman_render_bot (deploy/targets.yml). Production is Fly on
# @wordsman_bot; separate tokens cannot contend for a webhook, so redeploying or breaking
# this service is invisible to production. Env comes from `just deploy-render`
# (scripts/render-env.py) — do NOT hand-edit env vars in the dashboard: Render's
# PUT /env-vars replaces the whole list and the script is what merges it.
# Free plan sleeps after ~15 min idle → ~50s cold start before the first reply (Fly wakes
# in ~9s), which is why this is staging rather than production.
services:
  - type: web
    name: wordsman-tg-bot
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./deploy/Dockerfile.cloud
    dockerContext: .
    dockerCommand: tg-bot serve
    healthCheckPath: /healthz
    envVars:
      - key: TG_BOT_PORT
        value: "10000" # Render's canonical web port
      - key: TELEGRAM_BOT_TOKEN
        sync: false # set via dashboard/API, never committed
      - key: TG_BOT_SERVICE_NOTIFY
        value: "false" # standby stays silent in the service chat
