# Fly.io config for @wordsman_bot — the ACTIVE deployment (API + long-polling bot).
# Deploy from the repo root: fly deploy --ha=false   (--ha=false is MANDATORY: two
# machines would both long-poll and fight over getUpdates with 409s).
# Secret: printf 'TELEGRAM_BOT_TOKEN=%s' "$TG_BOT_TOKEN" | fly secrets import
app = "wordsman-tg-bot"
primary_region = "ams"

[build]
  dockerfile = "deploy/Dockerfile.cloud"

[env]
  TG_BOT_SERVICE_CHAT_ID = "-1002281796095"
  TG_BOT_SERVICE_THREAD_ID = "800"

[http_service]
  internal_port = 8340
  force_https = true
  auto_stop_machines = "off" # the poller must stay up
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
