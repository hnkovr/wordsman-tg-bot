# tg-bot defaults; every key is overridable via TG_BOT_* env vars (see src/tg_bot/config.py).
host: "0.0.0.0"
port: 8340
log_level: INFO

api_url: "http://localhost:8340"

# Short exception list of formats NOT generated (all other supported formats are).
formats_exclude:
  - sparsed-yaml
  - sparsed-json

# Words listed here (with their forms) are dropped from every generated wordlist.
except_list: config/except-words.txt

top: 200
min_level: "" # empty → wordsman conf/settings.yml default (B2)

# Subtitle providers in priority order (forwarded to fetch_srt.sh) — the same set the
# CLI/skill flow uses (english-apps/apps_pipeline.yml search.providers): gestdown for TV
# episodes, yify + subtitlecat for films. podnapisi is omitted on purpose (DNS-dead,
# wordsman#22), and srt-search's own default is podnapisi-only, so pinning this list is
# what makes fetches actually succeed. subtitlecat is what fetched data/in/odyssey-2026.
srt_providers:
  - gestdown
  - yify
  - subtitlecat

fetch_timeout: 240.0
dict_timeout: 600.0
max_document_mb: 20.0

# Per-user preferences DB (multi-user mode); shared by the bot and the API.
db_path: data/tg_bot.sqlite3

# Repo cache: reuse the wordsman checkout's data/in/<slug> subtitles and data/out/<slug>
# wordlists instead of re-fetching / re-generating. Those blobs live in Git-LFS, so on a
# deploy host without the LFS objects pulled this degrades to a live fetch automatically.
# repo_data_dir empty → auto-detect <wordsman_root>/data.
use_repo_cache: true
repo_data_dir:
